name: Probe AutoHome historical vault

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autohome-vault-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download historical snapshot
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 \
            https://raw.githubusercontent.com/swoiow/autohome/vaults/vaults/202202/data.vault \
            -o /tmp/data.vault
          curl -L --fail --retry 2 \
            https://raw.githubusercontent.com/swoiow/autohome/vaults/vaults/202202/manifest.json \
            -o /tmp/manifest.json

      - name: Decode payload and inspect framing
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, struct, zlib
          from pathlib import Path

          encoded = Path('/tmp/data.vault').read_bytes().strip()
          packed = base64.b85decode(encoded)
          print('encoded', len(encoded), 'packed', len(packed), 'packed_head', packed[:16].hex())
          raw = zlib.decompress(packed)
          Path('/tmp/data.raw').write_bytes(raw)
          print('raw', len(raw), 'raw_head_repr', repr(raw[:500]))
          print('raw_head_hex', raw[:256].hex(' '))

          for needle in (b'.csv', '传祺GS4'.encode(), '车型名称'.encode()):
              hits=[]; pos=0
              while True:
                  i=raw.find(needle,pos)
                  if i<0: break
                  hits.append(i); pos=i+1
                  if len(hits)>=12: break
              print('hits', needle, hits)
              for i in hits[:3]:
                  print('context', i, repr(raw[max(0,i-100):i+300]))

          # Try common container interpretations after decompression.
          for off in range(0, min(64, len(raw)-8), 4):
              print('u32', off, struct.unpack_from('<I', raw, off)[0])
          try:
              obj=json.loads(raw)
              print('json_root', type(obj).__name__, (list(obj)[:10] if isinstance(obj,dict) else len(obj)))
          except Exception as exc:
              print('not_json', type(exc).__name__, exc)
          PY
          file /tmp/data.raw || true
          tar -tf /tmp/data.raw 2>&1 | head -30 || true
          unzip -l /tmp/data.raw 2>&1 | head -30 || true
